name: Release

# Tag `vX.Y.Z` (after `pnpm version` bumped package.json / server.json / fxmanifest)
# -> full gate -> npm publish with provenance -> GitHub Release with the
# changelog section -> MCP Registry publish.
#
# npm auth, either way round:
#   1. Tokenless (preferred). On npmjs.com: package fivem-mcp-server ->
#      Settings -> Publishing access -> Trusted publisher -> GitHub Actions,
#      repository ziyacivan/fivem-mcp, workflow `.github/workflows/release.yml`.
#      Nothing to store in the repo. Needs npm CLI >= 11.5, newer than the one
#      bundled with the runner's Node — hence the explicit upgrade below.
#   2. Fallback: a granular npm access token with publish rights on this
#      package, stored as the repository secret NPM_TOKEN. Picked up
#      automatically when present; provenance still comes from this workflow's
#      OIDC identity.
# Without either, the registry answers `404 ... you do not have permission`.
#
# `mcp-publisher login github-oidc` always uses the workflow's GitHub identity
# (the io.github.<owner> namespace is claimed by repository ownership).

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Use an npm CLI that speaks OIDC trusted publishing
        run: |
          npm install -g npm@latest
          npm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci
      - name: Check the tag matches package.json
        run: |
          PKG=$(node -p "require('./package.json').version")
          test "v$PKG" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != package.json v$PKG"; exit 1; }
      - name: Publish to npm
        # provenance comes from publishConfig in package.json; NODE_AUTH_TOKEN
        # is empty unless the NPM_TOKEN fallback secret is set, in which case
        # setup-node's .npmrc uses it.
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Extract changelog section
        run: node scripts/changelog-section.mjs "${GITHUB_REF_NAME#v}" > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
      - name: Publish to the MCP Registry
        run: |
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

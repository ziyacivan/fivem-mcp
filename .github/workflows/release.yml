name: Release

# What happens on a `vX.Y.Z` tag: the full gate runs, and the GitHub Release is
# created from the matching CHANGELOG.md section.
#
# **npm publishing is manual and stays manual.** It is done from a maintainer's
# machine (`npm publish`, with `prepublishOnly` running the same gate), because
# the account publishes interactively. This workflow therefore never touches the
# registry with a token, and no NPM_TOKEN secret exists.
#
# The MCP Registry step runs only once the version is actually on npm — the
# registry validates the npm package — so the usual order is:
#   pnpm version <patch|minor|major>   # bumps + syncs + tags
#   npm publish                        # from your machine
#   git push --follow-tags             # this workflow: gate, Release, registry
# Tagging before publishing is fine too: the registry step then leaves a notice
# and you re-run this job after `npm publish`.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re-)release, e.g. v0.6.0
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci

      - name: Resolve the version and check it matches package.json
        id: version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          PKG=$(node -p "require('./package.json').version")
          test "v$PKG" = "$TAG" || { echo "tag $TAG != package.json v$PKG"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$PKG" >> "$GITHUB_OUTPUT"

      - name: Extract the changelog section
        run: node scripts/changelog-section.mjs "${{ steps.version.outputs.version }}" > release-notes.md

      - name: Create or update the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          body_path: release-notes.md

      - name: Publish to the MCP Registry (needs the npm version to exist)
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if ! npm view "fivem-mcp-server@$VERSION" version >/dev/null 2>&1; then
            echo "::notice title=MCP Registry skipped::fivem-mcp-server@$VERSION is not on npm yet. Run 'npm publish' from your machine, then re-run this job (Actions -> Release -> Run workflow -> tag ${{ steps.version.outputs.tag }})."
            exit 0
          fi
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

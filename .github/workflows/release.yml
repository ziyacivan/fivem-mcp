name: Release

# Tag `vX.Y.Z` (after `pnpm version` bumped package.json / server.json / fxmanifest)
# -> full gate -> npm publish with provenance -> GitHub Release with the
# changelog section -> MCP Registry publish.
#
# Auth is tokenless: npm OIDC trusted publishing and `mcp-publisher login
# github-oidc` both use this workflow's GitHub identity, so no NPM_TOKEN secret
# exists or is needed. One-time setup on npmjs.com: package settings ->
# Publishing access -> Trusted Publisher -> GitHub Actions, repository
# ziyacivan/fivem-mcp, workflow `.github/workflows/release.yml`.
# Trusted publishing needs npm CLI >= 11.5, newer than the one bundled with the
# runner's Node, hence the explicit upgrade below.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Use an npm CLI that speaks OIDC trusted publishing
        run: |
          npm install -g npm@latest
          npm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci
      - name: Check the tag matches package.json
        run: |
          PKG=$(node -p "require('./package.json').version")
          test "v$PKG" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != package.json v$PKG"; exit 1; }
      - name: Publish to npm
        # provenance comes from publishConfig in package.json
        run: npm publish
      - name: Extract changelog section
        run: node scripts/changelog-section.mjs "${GITHUB_REF_NAME#v}" > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
      - name: Publish to the MCP Registry
        run: |
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
